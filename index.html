<!doctype html><meta charset=utf-8><title>SpinCAM</title>
<h1>SpinCAM</h1>
<p>Install once: download <a href="pool/stable/spincam_0.9.11_amd64.deb">spincam_0.9.11_amd64.deb</a>, then run <code>sudo apt install ./spincam_0.9.11_amd64.deb</code>.</p>
<p>Windows: download <a href="pool/stable/windows/SpinCAM_Setup_0.9.11.exe">SpinCAM_Setup_0.9.11.exe</a> and run it. SpinCAM offers each new version itself (Help &gt; Check for updates…).</p>
<p>After that, new versions install themselves.</p>
